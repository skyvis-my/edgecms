name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e_smoke_base_url:
        description: "Optional deployed admin URL for remote Playwright smoke"
        required: false
        type: string
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prd-reference:
    name: PRD reference
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Check PR cites PRD.md
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bun scripts/check-prd-reference.ts PRD.md

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check merge markers
        run: bun run check:merge-markers

      - name: Lint
        run: bun run lint

      - name: Check docs
        run: bun run check:docs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run full test suite
        run: bun run check:tests

      - name: Check packages
        run: bun run check:package

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build admin
        run: bun run build:admin

      - name: Build API
        run: bun run build:api

      - name: Upload admin build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: apps/admin/dist/
          retention-days: 1

  e2e-smoke:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bun run --filter edgecms-admin playwright install --with-deps chromium

      - name: Run local E2E smoke
        run: bun run smoke:e2e:local

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/admin/.playwright/test-results/
          retention-days: 7

  remote-e2e-smoke:
    name: Remote E2E Smoke
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, test]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e_smoke_base_url != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bun run --filter edgecms-admin playwright install --with-deps chromium

      - name: Run remote PRD smoke
        env:
          BASE_URL: ${{ inputs.e2e_smoke_base_url }}
        run: bun run smoke:e2e:remote
