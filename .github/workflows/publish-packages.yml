name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (qualify manifests without pushing to npm)"
        required: true
        type: boolean
        default: true
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish Packages
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release readiness
        run: bun run check:release

      - name: Qualify package manifests
        run: bun run check:package

      - name: Publish packages
        run: |
          if [ "${{ github.event_name == 'release' || inputs.dry_run == false }}" = "true" ]; then
            if [ -z "$NPM_TOKEN" ]; then
              echo "::notice::NPM_TOKEN is not set, so packages were qualified but not published to npm."
              bun run publish:packages:dry-run
            else
              bun run publish:packages
            fi
          else
            bun run publish:packages:dry-run
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
