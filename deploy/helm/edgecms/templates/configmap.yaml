apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edgecms.name" . }}-api
  labels:
    {{- include "edgecms.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  PORT: "8787"
  HOST: "0.0.0.0"
  {{- /* Redis overrides come last so multi-replica CACHE_DRIVER=redis wins over values.env.memory */}}
  {{- if .Values.redis.enabled }}
  CACHE_DRIVER: "redis"
  {{- if .Values.redis.externalUrl }}
  REDIS_URL: {{ .Values.redis.externalUrl | quote }}
  {{- else }}
  REDIS_URL: {{ printf "redis://%s-redis:6379" (include "edgecms.name" .) | quote }}
  {{- end }}
  {{- end }}
