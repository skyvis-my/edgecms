{{- if .Values.redis.enabled }}
{{- if not .Values.redis.externalUrl }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "edgecms.name" . }}-redis
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edgecms.name" . }}-redis
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "edgecms.name" . }}-redis
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "edgecms.name" . }}-redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
{{- end }}
