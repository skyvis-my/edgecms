apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edgecms.name" . }}-api
  labels:
    {{- include "edgecms.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "edgecms.name" . }}-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "edgecms.name" . }}-api
        {{- include "edgecms.labels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "edgecms.name" . }}-api
            - secretRef:
                name: {{ include "edgecms.name" . }}-api
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
