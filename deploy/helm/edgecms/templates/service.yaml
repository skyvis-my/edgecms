apiVersion: v1
kind: Service
metadata:
  name: {{ include "edgecms.name" . }}-api
  labels:
    {{- include "edgecms.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "edgecms.name" . }}-api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
