apiVersion: v1
kind: Secret
metadata:
  name: edgecms-postgres
  namespace: edgecms
type: Opaque
stringData:
  POSTGRES_USER: edgecms
  POSTGRES_PASSWORD: edgecms
  POSTGRES_DB: edgecms
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edgecms-postgres
  namespace: edgecms
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: edgecms
  labels:
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: edgecms-postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "edgecms", "-d", "edgecms"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: edgecms-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: edgecms
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
