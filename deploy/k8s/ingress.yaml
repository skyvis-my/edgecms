apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edgecms
  namespace: edgecms
  annotations:
    # Example for nginx ingress — adjust to your controller.
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
spec:
  ingressClassName: nginx
  rules:
    - host: cms.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edgecms-api
                port:
                  number: 80
  # tls:
  #   - hosts: [cms.example.com]
  #     secretName: edgecms-tls
