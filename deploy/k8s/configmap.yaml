apiVersion: v1
kind: ConfigMap
metadata:
  name: edgecms-api
  namespace: edgecms
  labels:
    app.kubernetes.io/name: edgecms-api
data:
  DATABASE_DRIVER: "postgres"
  # memory = single-replica. For multi-replica: uncomment redis.yaml in kustomization,
  # set CACHE_DRIVER=redis and REDIS_URL=redis://redis:6379 (or an external URL).
  CACHE_DRIVER: "memory"
  MEDIA_DRIVER: "s3"
  S3_ENDPOINT: "http://minio:9000"
  S3_REGION: "us-east-1"
  S3_BUCKET: "edgecms-media"
  S3_FORCE_PATH_STYLE: "true"
  SIGNUP_POLICY: "disabled"
  SUPER_ADMIN_REQUIRE_MFA: "true"
  PORT: "8787"
  HOST: "0.0.0.0"
  BASE_URL: "https://cms.example.com"
  CORS_ALLOWED_ORIGINS: "https://cms.example.com"
  CDN_BASE_URL: "https://cdn.example.com"
  MEDIA_PUBLIC_BASE_URL: "https://cdn.example.com"
  # Optional Microsoft Entra ID — enable with secrets ENTRA_CLIENT_ID/SECRET
  # ENTRA_TENANT_ID: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
  # ENTRA_REDIRECT_URI: "https://cms.example.com/api/auth/callback/microsoft"
  # SSO_MODE: "entra"
