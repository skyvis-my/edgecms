# Replace placeholder values before apply. Prefer External Secrets / sealed-secrets in real clusters.
apiVersion: v1
kind: Secret
metadata:
  name: edgecms-api
  namespace: edgecms
  labels:
    app.kubernetes.io/name: edgecms-api
type: Opaque
stringData:
  BETTER_AUTH_SECRET: "REPLACE_WITH_32+_CHAR_SECRET"
  JWT_HS256_SECRET: "REPLACE_OPTIONAL_JWT_SECRET"
  DATABASE_URL: "postgres://edgecms:edgecms@postgres:5432/edgecms"
  S3_ACCESS_KEY_ID: "minioadmin"
  S3_SECRET_ACCESS_KEY: "minioadmin"
  SUPER_ADMIN_EMAILS: "admin@example.com"
  # Optional Microsoft Entra ID (leave empty to disable):
  # ENTRA_CLIENT_ID: ""
  # ENTRA_CLIENT_SECRET: ""
